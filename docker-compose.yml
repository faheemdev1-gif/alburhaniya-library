# Default local-dev stack: lean FastAPI backend (SQLite FTS5, no external
# search service needed) + React frontend. Matches what gets deployed to
# Render — good for testing the exact same setup on your own machine.
#
# Want the old Meilisearch/Qdrant hybrid-search stack instead?
# See docker-compose.legacy-meilisearch.yml.
version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arabic_backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STATIC_SITE_BASE_URL: ${STATIC_SITE_BASE_URL:-}
      ENABLE_LEGACY_MEILISEARCH: "false"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: arabic_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
