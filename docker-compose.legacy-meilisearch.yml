version: "3.9"

services:
  # ── Meilisearch (keyword / BM25 search) ────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: arabic_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme_in_production}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Qdrant (vector / semantic search) ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.8.1
    container_name: arabic_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arabic_backend
    restart: unless-stopped
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme_in_production}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QDRANT_URL: http://qdrant:6333
      BOOKS_DIR: /books
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ${BOOKS_DIR:-./books}:/books:ro
      - processed_data:/app/processed
    ports:
      - "8000:8000"
    depends_on:
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ── React frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: arabic_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  meilisearch_data:
  qdrant_data:
  processed_data:
