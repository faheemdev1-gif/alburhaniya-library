services:
  # ── Frontend: the React reader, served from Render's CDN ───────────────
  # A static site, so it does not spin down and costs nothing. `/api/*` is
  # rewritten onto the backend service below, which keeps the browser on a
  # single origin — no CORS, and the backend URL never enters the bundle.
  # Route order matters: the /api rule has to be matched before the SPA
  # catch-all, or every API call would be answered with index.html.
  - type: web
    name: burhaniya-library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://burhaniya-library-backend.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

  - type: web
    name: burhaniya-library-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: STATIC_SITE_BASE_URL
        value: ""   # fill in once your Vercel static site is deployed, e.g.
                    # https://your-library.vercel.app  (no trailing slash)
      - key: ENABLE_LEGACY_MEILISEARCH
        value: "false"

  # Same image as the backend above (same Dockerfile, same baked-in
  # library.db) — just started with a different command, so it serves
  # the MCP tool instead of the normal HTTP API. This is what Claude
  # connects to as a "custom connector" to search the library directly.
  - type: web
    name: burhaniya-library-mcp
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.mcp_server:app --host 0.0.0.0 --port 8000
    healthCheckPath: /mcp
    envVars:
      - key: CORS_ORIGINS
        value: "*"
